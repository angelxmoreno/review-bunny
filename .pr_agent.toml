# PR-Agent Configuration
# Docs: https://docs.pr-agent.ai
#
# PR-Agent is the open-source, community-maintained AI code review assistant.
# It runs on every PR via a GitHub Actions workflow in this repository.
#
# Secrets are configured in GitHub → Settings → Secrets and variables → Actions:
#   - OLLAMA_API_KEY: your Ollama Cloud API key
#
# For local CLI usage:
#   pip install pr-agent
#   export OLLAMA_API_KEY=your_key_here
#   pr-agent --pr_url https://github.com/angelxmoreno/review-bunny/pull/123 review

[config]
# Default model for reviews, improvements, and descriptions
model = "ollama/kimi-k2.7-code:cloud"
# Faster model for title generation and lightweight tasks
# other turbo options: gpt-oss:20b-cloud | gemma4:31b-cloud | nemotron-3-nano:30b-cloud | gpt-oss:120b-cloud | minimax-m2.7:cloud
model_turbo = "ollama/gpt-oss:20b-cloud"
# Model used if the default fails
fallback_models = ["ollama/minimax-m3:cloud"]
# Maximum tokens per LLM call
# 128000 is the effective context limit for long diffs
# (some models will be configured differently in their own sections)
custom_model_max_tokens = 128000

[ollama]
# Ollama Cloud API endpoint
api_base = "https://ollama.com"

[pr_reviewer]
# Extra instructions appended to the review prompt
extra_instructions = """\
Focus on:
- Correctness of the code and edge-case handling
- Adherence to project conventions (schema-first config, factory-pattern modules, Bun/TypeScript idioms)
- Maintainability and clarity
- Test coverage for changed behavior
"""

[pr_code_suggestions]
# Maximum number of code suggestions per review
num_code_suggestions = 5
# Only publish suggestions with a score >= threshold
suggestions_score_threshold = 7
extra_instructions = "Suggest test updates when behavior changes. Prefer small, focused improvements."

[pr_description]
# Generate AI PR titles and descriptions automatically
generate_ai_title = true
# Auto-label PRs based on content
push_labels = true
publish_labels = true
extra_instructions = "Keep the description concise and focused on the user-facing impact."
